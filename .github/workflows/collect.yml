name: Collect and Test VPN Configs

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  collect:
    name: Collect Test and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          PYTHONUNBUFFERED: "1"
          YANDEX_LOGIN: ${{ secrets.YANDEX_LOGIN }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/main.py

      - name: Show result
        if: always()
        run: |
          head -8 output/VLESS_WORKING.txt 2>/dev/null || echo "file not created"
          python3 -c "
          import json, pathlib
          f = pathlib.Path('output/stats.json')
          if f.exists():
              s = json.loads(f.read_text())
              print('Working:', s['total_working'], 'TLS:', s['tls_confirmed'])
          " 2>/dev/null || true

      - name: Commit output files
