name: Collect and Test VPN Configs

on:
  schedule:
    - cron: '*/30 * * * *'     # Запуск каждые 30 минут (самый надёжный формат)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "vpn-collector"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # уменьшил, чтобы не жрать лимиты

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          PYTHONUNBUFFERED: "1"
          YANDEX_LOGIN: ${{ secrets.YANDEX_LOGIN }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python src/main.py

      - name: Show result
        if: always()
        run: head -10 output/VLESS_WORKING.txt 2>/dev/null || echo "Output file not created"

      - name: Commit output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update configs - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
