name: Collect and Test VPN Configs

on:
 workflow_dispatch:

permissions:
  contents: write

# Если предыдущий запуск ещё не завершился — новый встаёт в очередь.
# cancel-in-progress: false = не отменяем работающий, просто ждём.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check if update needed
        id: check
        run: |
          # Пропускаем запуск если последнее обновление было меньше 12 минут назад.
          # Это нужно чтобы при частом cron не обновляться слишком часто.
          SKIP=false
          if [ -f output/stats.json ]; then
            UPDATED=$(python3 -c "
          import json, datetime, pathlib
          s = json.loads(pathlib.Path('output/stats.json').read_text())
          updated = s.get('updated_utc','')
          if updated:
              dt = datetime.datetime.fromisoformat(updated.replace('Z','+00:00'))
              diff = (datetime.datetime.now(datetime.timezone.utc) - dt).total_seconds()
              print(int(diff))
          else:
              print(9999)
          " 2>/dev/null || echo "9999")
            echo "Секунд с последнего обновления: $UPDATED"
            if [ "$UPDATED" -lt 720 ]; then
              echo "Обновление было менее 12 минут назад — пропускаем"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> $GITHUB_OUTPUT

      - name: Run collector
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          YANDEX_S3_BUCKET: ${{ secrets.YANDEX_S3_BUCKET }}
          YANDEX_S3_ACCESS_KEY: ${{ secrets.YANDEX_S3_ACCESS_KEY }}
          YANDEX_S3_SECRET_KEY: ${{ secrets.YANDEX_S3_SECRET_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          YANDEX_LOGIN: ${{ secrets.YANDEX_LOGIN }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAX_WORKERS: "150"
          MAX_CONFIGS: "500"
          TCP_TIMEOUT: "3.0"
          FETCH_TIMEOUT: "10"
        run: python src/main.py

      - name: Show result
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          python3 -c "
          import json, pathlib
          f = pathlib.Path('output/stats.json')
          if f.exists():
              s = json.loads(f.read_text())
              p = s['by_protocol']
              print('Working:', s['total_working'], '| RU:', p.get('ru_bypass',0))
          " 2>/dev/null || true

      - name: Commit output files
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
