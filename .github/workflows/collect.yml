name: Collect and Test VPN Configs

on:
  schedule:
    - cron: "0,15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          YANDEX_LOGIN: ${{ secrets.YANDEX_LOGIN }}
          YANDEX_PASS: ${{ secrets.YANDEX_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Ограничения для укладывания в 15 минут
          MAX_WORKERS: "150"
          MAX_CONFIGS: "800"
          TCP_TIMEOUT: "3.0"
          FETCH_TIMEOUT: "10"
        run: python src/main.py

      - name: Show result
        if: always()
        run: |
          head -6 output/VLESS_WORKING.txt 2>/dev/null || echo "VLESS_WORKING.txt not created"
          head -6 output/RU_BYPASS.txt 2>/dev/null || echo "RU_BYPASS.txt not created"
          python3 -c "
          import json, pathlib
          f = pathlib.Path('output/stats.json')
          if f.exists():
              s = json.loads(f.read_text())
              p = s['by_protocol']
              print('Working:', s['total_working'], '| RU Bypass:', p.get('ru_bypass',0))
          " 2>/dev/null || true

      - name: Commit output files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
