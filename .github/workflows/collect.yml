name: 🔄 Collect & Test VPN Configs

on:
  schedule:
    - cron: "0 * * * *"   # каждый час ровно в 00 минут
  workflow_dispatch:        # кнопка ручного запуска в GitHub UI

permissions:
  contents: write

jobs:
  collect:
    name: Полный пайплайн (10 шагов)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: 📥 Скачать репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 📦 Установить зависимости
        run: pip install -r requirements.txt

      - name: 🚀 Запустить коллектор
        env:
          PYTHONUNBUFFERED: "1"
          # Яндекс Диск
          YANDEX_LOGIN: ${{ secrets.YANDEX_LOGIN }}
          YANDEX_PASS:  ${{ secrets.YANDEX_PASS }}
          # Telegram-уведомления
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          # GitHub (подставляется автоматически)
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/main.py

      - name: 📊 Показать итог
        if: always()
        run: |
          echo "=== Первые строки VLESS_WORKING.txt ==="
          head -8 output/VLESS_WORKING.txt 2>/dev/null || echo "(файл не создан)"
          echo ""
          echo "=== Статистика ==="
          python3 -c "
          import json, pathlib
          f = pathlib.Path('output/stats.json')
          if f.exists():
              s = json.loads(f.read_text())
              print(f'Рабочих: {s[\"total_working\"]}  TLS: {s[\"tls_confirmed\"]}')
              print(f'Протоколы: {s[\"by_protocol\"]}')
              lat = s['latency']
              print(f'Задержка: min={lat[\"min_ms\"]}ms avg={lat[\"avg_ms\"]}ms p90={lat[\"p90_ms\"]}ms')
          else:
              print('stats.json не найден')
          " 2>/dev/null || true
          echo ""
          echo "=== Файлы в output/ ==="
          ls -lh output/ 2>/dev/null || echo "(папка пуста)"

      - name: 💾 Сохранить результат в репозиторий
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet \
            && echo "Изменений нет — коммит не нужен" \
            || (git commit -m "⚡ Обновление $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
